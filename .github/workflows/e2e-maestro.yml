name: E2E Maestro (manual / opt-in)

# ---------------------------------------------------------------------------
# OPT-IN ONLY. This workflow is NOT wired to push/PR on purpose.
#
# Maestro flows drive a real, BUILT app on a device or emulator. The default
# GitHub-hosted runners used by the rest of CI do not provision an Android
# emulator or iOS simulator, and there is no pre-built app artifact here, so
# running these flows requires extra setup that we deliberately keep out of
# the normal pipeline:
#
#   * an Android emulator (e.g. reactivecircus/android-emulator-runner) or a
#     macOS runner with an iOS simulator, AND
#   * a built dev/release app installed on that device.
#
# The `run-flows` job below now contains the full pipeline (build a debug APK,
# boot an emulator via reactivecircus/android-emulator-runner, install, run the
# flows), but it is gated off by default (it never runs unless you flip
# `inputs.confirm` to "yes") and has NEVER been executed yet — it was authored
# without an Android toolchain. The flows in `.maestro/` are likewise unvalidated
# against a real device. Treat the first green CI run as the validation.
# See docs/e2e-maestro.md.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Set to "yes" to actually attempt the Maestro run. Requires an
          emulator + a built app to be provisioned in this workflow first.
        required: false
        default: "no"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Always-runnable sanity job: prove the flows parse and the Maestro CLI is
  # installable, without needing a device.
  validate-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: List Maestro flows
        run: ls -la .maestro

  # Device-dependent job: builds a debug Android APK, boots an emulator, installs
  # the app, and runs the Maestro flows against it.
  #
  # UNVERIFIED: this job has never been executed in CI yet (it was authored in an
  # environment with no Android toolchain or device). The action SHAs and step
  # order are real and pinned, but the Expo prebuild / Gradle build step and the
  # launch activity may need tuning on the first real run — treat the first green
  # run as the validation, not this file. Gated off by default.
  run-flows:
    runs-on: ubuntu-latest
    needs: validate-flows
    if: ${{ inputs.confirm == 'yes' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build debug APK
        env:
          # Embed the JS bundle so the APK runs without a Metro server.
          EXPO_NO_DEV: "1"
        run: |
          npx expo prebuild --platform android --no-install
          (cd android && ./gradlew :app:assembleDebug --no-daemon)
          echo "APK_PATH=$(find android -path '*/outputs/apk/debug/*.apk' | head -1)" >> "$GITHUB_ENV"

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows on an emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r "$APK_PATH"
            maestro test .maestro --env APP_ID="${{ vars.MAESTRO_APP_ID }}"

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-results
          path: ~/.maestro/tests/
          if-no-files-found: ignore
          retention-days: 7
