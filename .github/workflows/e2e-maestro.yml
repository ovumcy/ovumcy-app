name: E2E Maestro (manual / opt-in)

# ---------------------------------------------------------------------------
# OPT-IN ONLY. This workflow is NOT wired to push/PR on purpose.
#
# Maestro flows drive a real, BUILT app on a device or emulator. The default
# GitHub-hosted runners used by the rest of CI do not provision an Android
# emulator or iOS simulator, and there is no pre-built app artifact here, so
# running these flows requires extra setup that we deliberately keep out of
# the normal pipeline:
#
#   * an Android emulator (e.g. reactivecircus/android-emulator-runner) or a
#     macOS runner with an iOS simulator, AND
#   * a built dev/release app installed on that device.
#
# The `run-flows` job below is gated off by default (it never runs unless you
# flip `inputs.confirm` to "yes") and exists as documented scaffolding only.
# The flows themselves live in `.maestro/` and have NOT yet been validated
# against a running device in this repo. See docs/e2e-maestro.md.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          Set to "yes" to actually attempt the Maestro run. Requires an
          emulator + a built app to be provisioned in this workflow first.
        required: false
        default: "no"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Always-runnable sanity job: prove the flows parse and the Maestro CLI is
  # installable, without needing a device.
  validate-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: List Maestro flows
        run: ls -la .maestro

  # Device-dependent job. Disabled unless explicitly confirmed because the
  # default runner has no emulator and no built app. Left as a documented
  # template — fill in the emulator + build steps before relying on it.
  run-flows:
    runs-on: ubuntu-latest
    needs: validate-flows
    if: ${{ inputs.confirm == 'yes' }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      # TODO(opt-in): provision a device and a built app before this point,
      # e.g. an Android emulator via reactivecircus/android-emulator-runner
      # (pin its SHA) plus `expo run:android` / a prebuilt APK.

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro flows
        run: maestro test .maestro --env APP_ID="${{ vars.MAESTRO_APP_ID }}"
