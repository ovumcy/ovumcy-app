name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Merge-queue validation runs: every workflow that owns a required status
  # check must also report on merge_group, or a queued merge waits forever.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Entitlement pubkey guard self-test
        run: node scripts/verify-entitlement-pubkeys.mjs --self-test

      - name: Base URL guard self-test
        run: node scripts/verify-base-urls.mjs --self-test

      - name: Tests (with coverage)
        run: npm test -- --coverage --coverageReporters=lcov --coverageReporters=json --coverageReporters=text-summary

      - name: Upload coverage for the patch-coverage job
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-json
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1
          # A re-run of this job after the upload succeeded must not fail on a
          # name already taken in this workflow run.
          overwrite: true

      - name: Expo doctor
        run: npm run doctor

      - name: Upload coverage to Codecov
        id: codecov
        # Advisory since the in-repo patch-coverage job below became the
        # enforced gate (scripts/patchcov.mjs; codecov/patch left the required
        # set the same day): the upload feeds dashboards, and an ingest outage
        # must never red a merge again.
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: true
          use_pypi: true

      - name: Warn on non-blocking Codecov failure
        if: ${{ steps.codecov.outcome == 'failure' }}
        run: echo "::warning::Codecov upload failed on push. Coverage was generated locally, but Codecov ingest returned an external error."

  # The job id is the status-check context name; keep it stable. Fails when a
  # modified, coverable src/ line is not covered by tests: statements AND branch
  # outcomes, the same bar as the external codecov/patch status (see
  # scripts/patchcov.mjs). A diff with no gated src/ lines passes trivially.
  # Runs on merge_group too, so a skipped required check is never what admits
  # a queued merge. Reads the profile `quality` produced.
  patch-coverage:
    runs-on: ubuntu-latest
    needs:
      - quality
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-json
          path: coverage

      - name: Determine base ref
        # pull_request.base.ref does not exist under merge_group; the queue's
        # base commit is merge_group.base_sha.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            base="$QUEUE_BASE_SHA"
            if [ -z "$base" ]; then
              echo "::error::no base commit in the merge_group payload"
              exit 1
            fi
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$base" || true
            fi
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "::error::merge_group base commit $base unreachable after fetch"
              exit 1
            fi
            echo "BASE_REF=$base" >> "$GITHUB_ENV"
          else
            git fetch --no-tags origin "$PR_BASE_REF"
            echo "BASE_REF=origin/$PR_BASE_REF" >> "$GITHUB_ENV"
          fi

      - name: Enforce patch coverage
        run: node scripts/patchcov.mjs

  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright web smoke
        run: npm run e2e:web
        env:
          PLAYWRIGHT_WEB_PORT: 4173
