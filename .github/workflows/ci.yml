name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Entitlement pubkey guard self-test
        run: node scripts/verify-entitlement-pubkeys.mjs --self-test

      - name: Base URL guard self-test
        run: node scripts/verify-base-urls.mjs --self-test

      - name: Tests (with coverage)
        run: npm test -- --coverage --coverageReporters=lcov --coverageReporters=text-summary

      - name: Expo doctor
        run: npm run doctor

      - name: Upload coverage to Codecov
        id: codecov
        # A failed ingest must fail a PR (the patch gate in codecov.yml is
        # load-bearing), but pushes to main tolerate a codecov outage with a
        # warning instead of a red main.
        continue-on-error: ${{ github.event_name == 'push' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: true
          use_pypi: true

      - name: Warn on non-blocking Codecov failure
        if: ${{ github.event_name == 'push' && steps.codecov.outcome == 'failure' }}
        run: echo "::warning::Codecov upload failed on push. Coverage was generated locally, but Codecov ingest returned an external error."

  web-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright web smoke
        run: npm run e2e:web
        env:
          PLAYWRIGHT_WEB_PORT: 4173
