name: Mutation (advisory)

# Advisory mutation-testing lane (Stryker), mirroring the Go `gremlins`
# discipline. It is NON-GATING: it runs weekly (and on demand) over a focused
# set of pure domain/policy modules and reports a mutation score. A low score
# never blocks CI — there is no break threshold and the mutation step is allowed
# to fail soft.
#
# "Advisory" applies to the RESULT, not to the run itself: the toolchain check
# below is unmasked, so a lane that cannot start Stryker fails loudly instead of
# reporting a green run that never instrumented a file.

on:
  schedule:
    # Weekly, Mondays 05:43 UTC (offset from the other scheduled scans).
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    # The 210-minute mutation step below (arithmetic in its own comment) plus
    # setup, `npm ci`, the preflight and the report upload. Those took 26s
    # together on the last dispatch; 15 minutes is budgeted for them so a cold
    # npm cache and a real — rather than absent — HTML report still fit. Leaves
    # a wide margin under the 360-minute hosted-runner cap.
    timeout-minutes: 225
    # NOTE: the advisory masking deliberately sits on the mutation step, not on
    # the job. Job-level `continue-on-error` also swallowed setup and toolchain
    # failures, so a Stryker run that crashed on startup still reported success.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Unmasked on purpose: proves the Stryker entrypoint loads and that every
      # configured mutate target still exists. Costs seconds and catches both
      # the dependency-resolution breakage and silent scope rot after a rename.
      - name: Verify mutation toolchain and scope
        run: |
          npx stryker --help > /dev/null
          node --input-type=module -e '
            import { existsSync } from "node:fs";
            import { pathToFileURL } from "node:url";
            const { default: config } = await import(pathToFileURL("stryker.config.mjs").href);
            const missing = config.mutate.filter((target) => !existsSync(target));
            if (missing.length > 0) {
              console.error("mutate targets not found: " + missing.join(", "));
              process.exit(1);
            }
            console.log("stryker toolchain OK; " + config.mutate.length + " mutate targets resolved");
          '

      - name: Run mutation testing
        id: mutation
        # Budgeted for a run that COMPLETES. The previous 24 minutes bounded the
        # lane but could only ever cover ~6% of the mutants, so the weekly run
        # reported a truncated score and uploaded no report at all.
        #
        #   measured on CI at `concurrency: 2`  210 mutants / 24 min = 8.7/min
        #   at `concurrency: 4` (4 vCPUs, near-linear; see stryker.config.mjs)
        #                                       ~17.4 mutants/min
        #   full set                            2692 / 17.4      = ~155 min
        #   + instrumentation and dry run       ~2 min (measured 1m49s)
        #   ------------------------------------------------------------------
        #   expected                            ~157 min
        #   budget with ~30% headroom           210 min
        #
        # The 8.7/min input is itself conservative — it charges the dry run to
        # the mutant count. 210 minutes also still fits if going from 2 to 4
        # workers turns out to be worth 1.5x rather than the expected 2x
        # (~208 min), so the headroom absorbs a bad scaling assumption, not just
        # runner jitter.
        #
        # Kept bounded rather than removed: an advisory run must not sit on a
        # runner indefinitely, and the step has to time out early enough to
        # leave the report upload room inside the job budget.
        timeout-minutes: 210
        # Advisory only: surface the score, never fail the workflow on a low
        # result or on a run that outgrew its budget.
        continue-on-error: true
        run: npm run mutation

      - name: Record mutation run outcome
        if: always()
        run: |
          echo "Mutation run outcome: \`${{ steps.mutation.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
