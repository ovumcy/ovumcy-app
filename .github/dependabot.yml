version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 2
    allow:
      - dependency-type: "direct"
    ignore:
      # Expo SDK pins these packages; upgrade them during an SDK-aligned dependency pass.
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-test-renderer"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      app-patch-updates:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "app"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    groups:
      # The codeql-action sub-actions (init/analyze/upload-sarif) must stay on
      # one version: split bumps fail CI with a config/runner version mismatch.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "github-actions"
