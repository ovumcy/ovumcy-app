version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 2
    allow:
      - dependency-type: "direct"
    ignore:
      # Every direct dependency that expo/bundledNativeModules.json pins to an exact version
      # (no ~ or ^): any bump past the pin fails `expo doctor`, so these move only with `expo`
      # via `npx expo install --fix`. Range-pinned modules (expo-*, screens, ...) stay
      # monitored — their patch bumps satisfy the range. Ignored here also means no Dependabot
      # security-update PR; advisories still raise alerts and reach npm-audit-production.
      - dependency-name: "@react-native-async-storage/async-storage"
      - dependency-name: "@react-native-community/datetimepicker"
      - dependency-name: "@react-native-community/slider"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-svg"
      - dependency-name: "react-native-worklets"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      app-patch-updates:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "app"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:15"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    groups:
      # The codeql-action sub-actions (init/analyze/upload-sarif) must stay on
      # one version: split bumps fail CI with a config/runner version mismatch.
      codeql-action:
        patterns:
          - "github/codeql-action*"
    labels:
      - "dependencies"
      - "github-actions"
