# Gitleaks configuration for ovumcy-app.
#
# Extends gitleaks' built-in default rule set (do not replace it) and adds
# only allowlist entries for already-triaged, non-secret fixture values. A
# full-history scan (--log-opts=--all) found zero real secrets; every entry
# below is a known test fixture, never production or non-test source.
[extend]
useDefault = true

[allowlist]
  # Broad, path-based allowlisting is intentional and scoped to a file class
  # that is legitimately allowed to carry fixture values: TypeScript test
  # files. These paths are never production source and are not reachable at
  # runtime. Mirrors ovumcy-web's '_test\.go$' allowlist, retargeted to this
  # repo's '*.test.ts' convention.
  paths = [
    # All TypeScript test files repo-wide. The golden crypto interop vectors
    # live here: the Ed25519 public key and signed entitlement JWT pinned to
    # match the Go signer in src/security/entitlement-token.test.ts (reused by
    # src/services/managed-premium-features-service.test.ts) exercise
    # token-verification and the end-to-end entitlement path without any
    # private key. gitleaks' generic-api-key rule flags the base64 token
    # string; it is a public, non-secret test vector.
    '''\.test\.ts$''',
  ]

  # Belt-and-suspenders exact-value allowlisting for the golden vector named
  # above, in case a future refactor moves it out of an allowlisted path (e.g.
  # extracted into a shared non-test fixture helper). If that happens, prefer
  # re-scoping the path allowlist over relying on this list. This is the
  # signature segment of the signed golden JWT — a public test vector, not a
  # credential; no real secret equals it.
  regexes = [
    '''aLxva7cu0mWgbcl5QJCnFQFvyC4z5j9GEEuSTnSDomqkC1xccZl3tBaw45_RwaTLlRVQS9qjgRaDO8Nq2w2zBw''',
  ]
