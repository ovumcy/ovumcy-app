# Gitleaks configuration for ovumcy-app.
#
# Extends gitleaks' built-in default rule set (do not replace it) and adds
# only allowlist entries for already-triaged, non-secret fixture values. A
# full-history scan (--log-opts=--all) found zero real secrets; every entry
# below is a known test fixture, never production or non-test source.
[extend]
useDefault = true

[allowlist]
  # Only the test files that carry a triaged public fixture are allowlisted;
  # every other test file is scanned like production source, so a real secret
  # pasted into a new test is still caught. Each file below holds the golden
  # signed entitlement JWT (pinned to match the Go signer) or a deep-link
  # query sample, both of which trip generic-api-key; neither is a credential.
  # A new fixture file is added here deliberately, not by glob.
  paths = [
    '''src/security/deep-link-query-parsing\.test\.tsx$''',
    '''src/security/entitlement-token\.test\.ts$''',
    '''src/services/managed-premium-features-service\.test\.ts$''',
    '''src/services/premium-entitlement-unlock\.test\.ts$''',
  ]

  # Exact-value allowlisting for the golden vector in case it moves out of an
  # allowlisted file. This is the signature segment of the signed golden JWT —
  # a public test vector, not a credential; no real secret equals it.
  regexes = [
    '''aLxva7cu0mWgbcl5QJCnFQFvyC4z5j9GEEuSTnSDomqkC1xccZl3tBaw45_RwaTLlRVQS9qjgRaDO8Nq2w2zBw''',
  ]
